<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page introuvable · NOVA SPACE</title>
  <meta name="robots" content="noindex">

  <!-- Font Awesome 6 Free -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">

  <!-- CSS global -->
  <link rel="stylesheet" href="css/nova.css">

  <style>
    /* Étoiles de fond 404 */
    .stars-404 {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .stars-404::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(61,214,245,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 10%, rgba(242,244,247,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 70%, rgba(61,214,245,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 90%, rgba(242,244,247,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 50%, rgba(61,214,245,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 60%, rgba(242,244,247,0.2) 0%, transparent 100%);
      background-size: 400px 400px, 500px 300px, 350px 450px, 420px 380px, 480px 320px, 300px 500px;
      animation: twinkle 8s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.6; }
      to   { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stars-404::before { animation: none; }
    }
  </style>
</head>
<body>
  <div class="stars-404" aria-hidden="true"></div>

  <div class="page-404">
    <div class="code-404" aria-hidden="true">404</div>

    <div class="kicker">
      <i class="fas fa-satellite-dish"></i>
      Signal perdu
    </div>

    <h1>Page introuvable</h1>

    <p style="max-width:44ch;text-align:center;">
      Cette page n'existe pas ou a été déplacée. Revenez à la base.
    </p>

    <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:1.5rem;">
      <a href="fr/index.html" class="btn-primary">
        <i class="fas fa-home"></i>
        Accueil FR
      </a>
      <a href="en/index.html" class="btn-secondary">
        <i class="fas fa-home"></i>
        Home EN
      </a>
    </div>

    <div class="telemetry-badge" style="margin-top:2rem;">
      <span>STATUS</span>
      <span style="color:var(--clr-flame);">ERR_404</span>
    </div>
  </div>

  <!-- JS global -->
  <script src="js/nova.js"></script>
</body>
</html>
