<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA SPACE — Redirection</title>

  <!--
    NOVA SPACE — Redirection intelligente v1.0
    Détecte la langue du navigateur et redirige vers /fr/ ou /en/.
    Défaut : /fr/
  -->

  <!-- Fallback meta refresh vers /fr/ si JS désactivé -->
  <meta http-equiv="refresh" content="0;url=fr/">

  <style>
    body {
      margin: 0;
      background: #07090D;
      color: #C9CED6;
      font-family: 'IBM Plex Mono', monospace, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-size: 0.875rem;
      letter-spacing: 0.08em;
    }
    p { opacity: 0.5; }
  </style>
</head>
<body>
  <p>REDIRECTING…</p>

  <script>
    (function () {
      var lang = (navigator.language || navigator.userLanguage || 'fr').toLowerCase();
      var dest = lang.startsWith('en') ? 'en/' : 'fr/';
      window.location.replace(dest);
    })();
  </script>
</body>
</html>
