# Build settings for your application
[build]
  # The folder where Netlify runs your build command (defaults to root)
  base = "/"
  
  # The command to build your app (leave blank or remove if using plain HTML/CSS/JS)
  command = "npm run build"
  
  # The folder containing your final deploy-ready files (e.g., dist, build, public, or .)
  publish = "dist"

# Optional: Single Page App (SPA) routing rule (for React, Vue, Angular, etc.)
# Ensures all routes point back to index.html so refreshing pages doesn't cause a 404 error
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
